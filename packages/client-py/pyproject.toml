[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "probate-client"
version = "0.1.0"
description = "Typed sync and async client for the Probate Courthouse public API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsh Bhanushali", email = "bhanushaliharsh434@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["probate", "courthouse", "api-client"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/harshbhx/probate"
Repository = "https://github.com/harshbhx/probate"
Issues = "https://github.com/harshbhx/probate/issues"
Documentation = "https://probate.dualmindlab.tech/docs/reference/api"
Changelog = "https://github.com/harshbhx/probate/blob/main/packages/client-py/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probate_client = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*timeout. argument with the TestClient",
  "ignore:Using .httpx. with .starlette.testclient.",
]
