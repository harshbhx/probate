[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "probate-memory-court"
version = "0.1.0"
description = "Memory with a court, for any AI agent: an MCP server that puts every memory on trial before it is saved, so a poisoned one is never remembered."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsh Bhanushali", email = "bhanushaliharsh434@gmail.com" }]
keywords = ["mcp", "agent-memory", "memory-poisoning", "prompt-injection", "agent-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  # Not on PyPI yet: the court checks come from Probate's v0.1.0 release.
  "probate-court-checks @ https://github.com/harshbhx/probate/releases/download/v0.1.0/probate_court_checks-0.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
probate-memory = "probate_memory.cli:main"

[project.urls]
Homepage = "https://github.com/harshbhx/probate/tree/main/packages/memory-court"
Source = "https://github.com/harshbhx/probate"
Issues = "https://github.com/harshbhx/probate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probate_memory = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
