[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "probate-memory-court"
version = "0.2.0"
description = "Memory with a court, for any AI agent: an MCP server that puts every memory on trial before it is saved, so a poisoned one is never remembered."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsh Bhanushali", email = "bhanushaliharsh434@gmail.com" }]
keywords = ["mcp", "agent-memory", "memory-poisoning", "prompt-injection", "agent-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "probate-court-checks>=0.2.0",
]

[project.optional-dependencies]
# The plug-ins (probate_memory.integrations). Mem0 and Letta are duck-typed and need nothing extra
# to import; these extras just install the library being guarded.
mem0 = ["mem0ai>=1"]
langgraph = ["langgraph>=0.4"]
letta = ["letta-client>=1"]
dev = ["pytest>=8", "ruff>=0.6", "langgraph>=0.4", "letta-client>=1"]

[project.scripts]
probate-memory = "probate_memory.cli:main"
probate-memory-court = "probate_memory.cli:main"

[project.urls]
Homepage = "https://github.com/harshbhx/probate"
Repository = "https://github.com/harshbhx/probate"
Issues = "https://github.com/harshbhx/probate/issues"
Documentation = "https://probate.dualmindlab.tech/docs/memory-court"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probate_memory = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
