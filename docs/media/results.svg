<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Attacks resisted at the door, by branch</title>
<desc id="d">v1 real run with a working gate: 9 of 18. v2-h-inherit: 10 of 12. v2-h-control: 0 of 12. v2-h-fresh: 5 of 12. v2-main: 17 of 22 (newer code, a showcase run).</desc>
