name: codeql

# Static analysis for the web code (JavaScript/TypeScript), the Courthouse (Python) and the
# workflow files themselves. Results appear under Security > Code scanning.
# Needs: nothing to configure for a public repo (private repos need GitHub Code Security).

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - design/**
      - datasets/**
      - LICENSE
      - CITATION.cff
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - design/**
      - datasets/**
      - LICENSE
      - CITATION.cff
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read # lets private repos read workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
