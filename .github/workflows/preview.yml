name: preview

# A live preview of every pull request: two Cloudflare Workers, probate-site-pr-<n> (landing +
# docs) and probate-web-pr-<n> (the live family site, frozen to a static snapshot of a
# fake-mode simulation). The Workers are deleted when the PR closes.
#
# Safety:
#  - Runs on `pull_request`, never `pull_request_target`, and only for PRs from this repository.
#    Fork PRs get no secrets, so every deploy step is skipped for them.
#  - The build job runs the PR's code but has no secrets. The deploy job has the Cloudflare
#    token but checks out and executes none of the PR's code: it only uploads the built files.
#  - Skips cleanly (green, with a notice) while CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#    are not set.
# Details: docs/CICD.md

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only changes that alter what the two preview sites show. The `closed` cleanup runs for the
    # same set, which is exactly the set of PRs that can have created a preview.
    paths:
      - apps/site/**
      - apps/web/**
      - packages/faces/**
      - packages/tokens/**
      - packages/moments/**
      - services/core/**
      - config/**
      - scripts/preview_*.py
      - package.json
      - package-lock.json
      - .github/workflows/preview.yml
      - .github/actions/**

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  # Never cancelled: a half-finished deploy or cleanup would leave a Worker behind.
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.168.0" # same as package-lock.json; the deploy job installs it on its own
  WRANGLER_SEND_METRICS: "false"

jobs:
  prepare:
    name: Check secrets and work out the URLs
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      site_url: ${{ steps.gate.outputs.site_url }}
      web_url: ${{ steps.gate.outputs.web_url }}
    steps:
      - name: Gate on Cloudflare secrets and find the workers.dev address
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN_VAR: ${{ vars.CF_WORKERS_SUBDOMAIN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice title=Preview skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set, so no preview was deployed. See docs/CICD.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sub="$SUBDOMAIN_VAR"
          if [ -z "$sub" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          fi
          if [ -z "$sub" ]; then
            echo "::error::Could not find the account's workers.dev subdomain. Register one in the Cloudflare dashboard (Workers & Pages), or set the repository variable CF_WORKERS_SUBDOMAIN."
            exit 1
          fi
          {
            echo "enabled=true"
            echo "site_url=https://probate-site-pr-${PR}.${sub}.workers.dev"
            echo "web_url=https://probate-web-pr-${PR}.${sub}.workers.dev"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build both sites and the live snapshot
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-core

      - name: Freeze a fake-mode family into static JSON
        run: python scripts/preview_snapshot.py --out .data/preview/snapshot

      - name: Build the landing page and docs
        env:
          NEXT_PUBLIC_LIVE_URL: ${{ needs.prepare.outputs.web_url }}
          NEXT_PUBLIC_SITE_URL: ${{ needs.prepare.outputs.site_url }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: npm run build -w @probate/site

      - name: Build the live site against the snapshot
        env:
          VITE_DOCS_URL: ${{ needs.prepare.outputs.site_url }}
          VITE_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          # Applied to this throwaway workspace only. It is never committed.
          python scripts/preview_patch_api.py apps/web/src/lib/api.ts
          npm run build -w @probate/web

      - name: Assemble the deploy folders
        run: |
          python scripts/preview_assemble.py --dist apps/web/dist --snapshot .data/preview/snapshot --out .data/preview/upload/web
          cp -r apps/site/out .data/preview/upload/site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: .data/preview/upload
          if-no-files-found: error
          include-hidden-files: true # the path itself lives under .data/
          retention-days: 3

  deploy:
    name: Deploy the preview Workers
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # the sticky comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: upload

      - name: Install wrangler (this version only, outside the PR's code)
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund "wrangler@${WRANGLER_VERSION}"
          echo "$RUNNER_TEMP/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy probate-site-pr-<n> and probate-web-pr-<n>
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Configs are written here, not read from the PR, so a PR cannot change what gets deployed where.
          cat > wrangler-site.jsonc <<EOF
          { "name": "probate-site-pr-${PR}", "compatibility_date": "2026-11-20",
            "assets": { "directory": "./upload/site", "html_handling": "auto-trailing-slash", "not_found_handling": "404-page" } }
          EOF
          cat > wrangler-web.jsonc <<EOF
          { "name": "probate-web-pr-${PR}", "compatibility_date": "2026-11-20",
            "assets": { "directory": "./upload/web", "not_found_handling": "single-page-application" } }
          EOF
          wrangler deploy --config wrangler-site.jsonc
          wrangler deploy --config wrangler-web.jsonc

      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SITE_URL: ${{ needs.prepare.outputs.site_url }}
          WEB_URL: ${{ needs.prepare.outputs.web_url }}
        run: |
          set -euo pipefail
          cat > comment.md <<EOF
          <!-- probate-preview -->
          ### Preview ready

          | | |
          | --- | --- |
          | Landing page and docs | ${SITE_URL} |
          | Live family site (static snapshot) | ${WEB_URL} |

          Built from ${SHA:0:7}. The live site shows a simulated family, and actions that need the real Courthouse say so. Both Workers are deleted when this PR closes.
          EOF
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- probate-preview -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  cleanup:
    name: Delete the preview Workers
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Delete both Workers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice title=Nothing to clean up::Cloudflare secrets are not set, so no preview Workers were created."
            exit 0
          fi
          for name in "probate-site-pr-${PR}" "probate-web-pr-${PR}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/${name}?force=true")
            case "$code" in
              200) echo "deleted $name" ;;
              404) echo "$name did not exist" ;;
              *) echo "::error::Deleting $name returned HTTP $code"; exit 1 ;;
            esac
          done

      - name: Mark the comment as removed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- probate-preview -->"))) | .id' | head -n1)
          [ -n "$id" ] || exit 0
          printf '%s\n' '<!-- probate-preview -->' '### Preview removed' '' 'This PR is closed, so its preview Workers were deleted.' > comment.md
          gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md > /dev/null
