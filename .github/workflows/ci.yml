name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check probate tests
      - run: PROBATE_DATA_DIR=$RUNNER_TEMP/probate python -m pytest -q
      - name: Simulate a family
        run: PROBATE_FAKE=1 PROBATE_DATA_DIR=$RUNNER_TEMP/sim python -m probate.courthouse.simulate --generations 6

  court-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/court-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q
      - run: python ../../datasets/probate-attack-suite/build.py --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Family faces
        run: npm test -w kinfaces
      - name: Type checks
        run: npm run lint
      - name: Build the live site and the landing + docs
        run: npm run build
