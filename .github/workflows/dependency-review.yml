name: dependency-review

# Blocks a pull request that adds a dependency with a known high or critical vulnerability.
# Needs the dependency graph. If the repository has it switched off (Settings > Advanced Security),
# GitHub answers "Forbidden" and this job cannot run. It is therefore non-blocking until the graph is on;
# once it is, remove `continue-on-error` below and make `review` a required check.

on:
  pull_request:
    paths:
      - "**/package.json"
      - package-lock.json
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - .github/workflows/**
      - .github/actions/**

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true # remove once the dependency graph is enabled
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never # the summary is on the run page; no write token needed
