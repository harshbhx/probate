name: secret-scan

# Scans commits for committed secrets with the gitleaks CLI (MIT licence, free everywhere).
# We deliberately do not use gitleaks/gitleaks-action: it needs a paid GITLEAKS_LICENSE for
# repositories owned by an organization (it is free for personal repositories like this one),
# and the CLI does the same scan with no licence. The binary is pinned and checked against
# its published SHA-256 before it runs.
#   pull_request: only the commits the PR adds.  push / weekly: the whole history.
# To allow a known false positive, add a .gitleaks.toml (picked up automatically) or a
# .gitleaksignore file with the finding's fingerprint.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tgz
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          args=(git --redact --verbose --no-banner)
          # Only the history of what is being scanned, not every other branch the checkout fetched.
          if [ "$EVENT" = "pull_request" ]; then
            args+=("--log-opts=${BASE_SHA}..${HEAD_SHA}")
          else
            args+=("--log-opts=${GITHUB_SHA}")
          fi
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}" .
