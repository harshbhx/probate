name: docker

# Builds the Courthouse image and, only when asked, publishes it to GitHub Container Registry as
# ghcr.io/harshbhx/probate. MANUAL ONLY: no push, schedule or pull_request trigger.
#
#   publish = false (default)  builds the image and smoke-tests it. Publishes nothing.
#   publish = true             also pushes ghcr.io/harshbhx/probate:<tag> (and :latest if ticked).
#
# Uses the workflow's own GITHUB_TOKEN. No secret is baked into the image.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to ghcr.io (default: build and test only)"
        type: boolean
        default: false
      tag:
        description: "Image tag, such as 0.2.0"
        type: string
        default: "dev"
      latest:
        description: "Also tag as latest"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docker
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/harshbhx/probate

jobs:
  image:
    name: Build and test the image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: probate:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (simulation mode)
        run: |
          set -euo pipefail
          docker run -d --name probate -p 8080:8080 -e PROBATE_FAKE=1 probate:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "${ok:-0}" = 1 ] || { docker logs probate; echo "::error::Courthouse did not answer"; exit 1; }
          echo "Courthouse answered."

      - name: Log in to ghcr.io
        if: ${{ inputs.publish }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag probate:test "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          if [ "$LATEST" = "true" ]; then
            docker tag probate:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "Published $IMAGE:$TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"
