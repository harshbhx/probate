name: Set up the Courthouse service
description: Python with the pip cache, then an editable install of services/core.
inputs:
  python-version:
    description: Python version
    default: "3.13"
  extras:
    description: Extras of the probate package to install
    default: dev
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: services/core/pyproject.toml
    - name: Install the Courthouse
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: python -m pip install -e "services/core[${EXTRAS}]"
